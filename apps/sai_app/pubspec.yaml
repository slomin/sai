name: sai_app
description: sai for macOS.
publish_to: none
version: 2.0.0-dev+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  sai_core:
    path: ../../packages/sai_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  yaml: ^3.1.0

flutter:
  uses-material-design: true
  # The Sai visual system's two families (SIL OFL, licences beside them).
  # Space Grotesk is a variable font: styles set the `wght` axis.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: fonts/SpaceGrotesk[wght].ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
