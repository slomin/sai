name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: go test ./...

      - name: Build for macOS (ARM64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -o build/sai-darwin-arm64 ./cmd/sai

      - name: Build for macOS (AMD64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -o build/sai-darwin-amd64 ./cmd/sai

      - name: Build for Linux (ARM64)
        run: |
          GOOS=linux GOARCH=arm64 go build -o build/sai-linux-arm64 ./cmd/sai

      - name: Build for Linux (AMD64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o build/sai-linux-amd64 ./cmd/sai

      - name: Create checksums
        run: |
          cd build
          shasum -a 256 sai-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/sai-darwin-arm64
            build/sai-darwin-amd64
            build/sai-linux-arm64
            build/sai-linux-amd64
            build/checksums.txt
          body: |
            ## Installation

            ### macOS

            **Option 1: Quick Install (Recommended)**
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            **Option 2: Manual Download**

            Download the appropriate binary for your system:
            - Apple Silicon (M1/M2/M3): `sai-darwin-arm64`
            - Intel Mac: `sai-darwin-amd64`

            ```bash
            # Download (replace with your architecture)
            curl -L -o sai https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/sai-darwin-arm64

            # Make executable
            chmod +x sai

            # Move to PATH
            mkdir -p ~/.local/bin
            mv sai ~/.local/bin/

            # Remove quarantine attribute (macOS Gatekeeper)
            xattr -d com.apple.quarantine ~/.local/bin/sai

            # Add to your shell config if needed
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.zshrc
            source ~/.zshrc
            ```

            ### Linux

            ```bash
            # Download (replace with your architecture)
            curl -L -o sai https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/sai-linux-amd64
            chmod +x sai
            sudo mv sai /usr/local/bin/
            ```

            ### First Run

            After installation, configure your LM Studio or llama.cpp endpoint:

            ```bash
            sai --settings
            ```

            See `sai --help` for all options.
          draft: false
          prerelease: false
