name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  attribution:
    name: No attribution trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect the commits this PR adds
        run: |
          log=$(git log --format='%H %s%n%b' "origin/${{ github.base_ref }}..HEAD")
          if bad=$(printf '%s\n' "$log" | grep -iE -f .githooks/attribution-patterns); then
            echo "Attribution trailer found:" >&2
            echo "$bad" >&2
            exit 1
          fi

  secrets:
    name: No secrets in the tree or the PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan the checked-out tree
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact
      - name: Scan the whole history
        # Every commit reachable from the checkout, merges and side
        # branches included, on pushes and pull requests alike; the
        # repository is small enough that a full scan is instant.
        run: ./gitleaks git . --config .gitleaks.toml --no-banner --redact

  dart:
    name: Analyze and test (core, tui)
    runs-on: ubuntu-latest
    # A hung runner must fail fast, not sit for the six-hour default:
    # the whole job takes about three minutes when healthy.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The SDK download is the one step that has hung (#113): give it a
      # deadline and one clean second try before the job is declared dead.
      - uses: subosito/flutter-action@v2
        id: flutter
        timeout-minutes: 8
        continue-on-error: true
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Drop a half-installed SDK before the second try
        if: steps.flutter.outcome == 'failure'
        run: rm -rf "$RUNNER_TOOL_CACHE/flutter"
      - uses: subosito/flutter-action@v2
        if: steps.flutter.outcome == 'failure'
        timeout-minutes: 8
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages apps/sai_tui apps/sai_app/lib apps/sai_app/test
      - name: Analyze
        run: dart analyze --fatal-infos packages apps
      - name: Test sai_core
        working-directory: packages/sai_core
        run: dart test
      - name: Test sai_tui
        working-directory: apps/sai_tui
        run: dart test
      - name: Build sai_tui
        # The terminal client ships as a bundle (#41, #18): the binary
        # plus the SQLite package:sqlite3 builds through a Dart hook,
        # which `dart compile exe` refuses — hence `dart build cli`.
        # Prove it builds and starts; the settings path and the archive
        # root keep the run off any real file (decision render reads a
        # scratch log and prints an empty document).
        # Both flavors' entry points (ADR 0019): each names itself.
        run: |
          dart build cli -t apps/sai_tui/bin/sai_tui.dart --root-package=sai_tui -o build/tui
          SAI_SETTINGS_FILE="$RUNNER_TEMP/settings.json" build/tui/bundle/bin/sai_tui reasoning
          SAI_ARCHIVE_ROOT="$RUNNER_TEMP/archive" SAI_SETTINGS_FILE="$RUNNER_TEMP/settings.json" build/tui/bundle/bin/sai_tui decision render - | grep -q "^No decisions recorded yet"
          [ "$(SAI_SETTINGS_FILE="$RUNNER_TEMP/settings.json" build/tui/bundle/bin/sai_tui version)" = "sai_tui $(sed -n 's/^version: //p' packages/sai_core/pubspec.yaml)" ]
          dart build cli -t apps/sai_tui/bin/sai_tui-dev.dart --root-package=sai_tui -o build/tui-dev
          [ "$(SAI_SETTINGS_FILE="$RUNNER_TEMP/settings-dev.json" build/tui-dev/bundle/bin/sai_tui-dev version)" = "sai_tui-dev $(sed -n 's/^version: //p' packages/sai_core/pubspec.yaml)" ]

  macos:
    name: Test and build (app)
    runs-on: macos-26
    # About seven minutes when healthy (#113 sat 43 minutes on the SDK
    # download before it could even be cancelled).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The SDK download is the one step that has hung (#113): give it a
      # deadline and one clean second try before the job is declared dead.
      - uses: subosito/flutter-action@v2
        id: flutter
        timeout-minutes: 8
        continue-on-error: true
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Drop a half-installed SDK before the second try
        if: steps.flutter.outcome == 'failure'
        run: rm -rf "$RUNNER_TOOL_CACHE/flutter"
      - uses: subosito/flutter-action@v2
        if: steps.flutter.outcome == 'failure'
        timeout-minutes: 8
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      - name: Check the committed app icons
        run: swift tool/app-icons.swift check
      - name: Test sai_core against the Keychain (macOS only)
        working-directory: packages/sai_core
        run: dart test test/secrets
      - name: Test sai_app
        working-directory: apps/sai_app
        run: flutter test
      - name: Build sai.app and sai-dev.app (debug)
        # Both flavors (ADR 0019); each bundle must say which it is.
        working-directory: apps/sai_app
        run: |
          flutter build macos --debug --flavor stable
          stable_app=build/macos/Build/Products/Debug-stable/sai.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :SaiFlavor' "$stable_app/Contents/Info.plist")" = stable ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$stable_app/Contents/Info.plist")" = AppIcon-stable ]
          [ -f "$stable_app/Contents/Resources/AppIcon-stable.icns" ]
          xcrun assetutil --info "$stable_app/Contents/Resources/Assets.car" | grep -q '"Name" : "AppIcon-stable"'
          ! xcrun assetutil --info "$stable_app/Contents/Resources/Assets.car" | grep -q '"Name" : "AppIcon-dev"'
          stable_icon=$(shasum -a 256 "$stable_app/Contents/Resources/AppIcon-stable.icns" | cut -d ' ' -f 1)
          flutter build macos --debug --flavor dev
          dev_app=build/macos/Build/Products/Debug-dev/sai-dev.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :SaiFlavor' "$dev_app/Contents/Info.plist")" = dev ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$dev_app/Contents/Info.plist")" = AppIcon-dev ]
          [ -f "$dev_app/Contents/Resources/AppIcon-dev.icns" ]
          xcrun assetutil --info "$dev_app/Contents/Resources/Assets.car" | grep -q '"Name" : "AppIcon-dev"'
          ! xcrun assetutil --info "$dev_app/Contents/Resources/Assets.car" | grep -q '"Name" : "AppIcon-stable"'
          dev_icon=$(shasum -a 256 "$dev_app/Contents/Resources/AppIcon-dev.icns" | cut -d ' ' -f 1)
          [ "$stable_icon" != "$dev_icon" ]
      - name: Test the local install against temporary roots
        # tool/install-local.sh (#87) with an ad-hoc-signed fixture
        # release; HOME and every root point into the runner's temp dir.
        run: |
          for s in tool/*.sh tool/test/*.sh; do sh -n "$s"; done
          sh tool/test/install_local_test.sh
          sh tool/test/release_sign_test.sh
          sh tool/test/vendor_app_server_test.sh
