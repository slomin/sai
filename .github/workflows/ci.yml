name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  attribution:
    name: No attribution trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect the commits this PR adds
        run: |
          log=$(git log --format='%H %s%n%b' "origin/${{ github.base_ref }}..HEAD")
          if bad=$(printf '%s\n' "$log" | grep -iE -f .githooks/attribution-patterns); then
            echo "Attribution trailer found:" >&2
            echo "$bad" >&2
            exit 1
          fi

  dart:
    name: Analyze and test (core, tui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages apps/sai_tui apps/sai_app/lib apps/sai_app/test
      - name: Analyze
        run: dart analyze --fatal-infos packages apps
      - name: Test sai_core
        working-directory: packages/sai_core
        run: dart test
      - name: Test sai_tui
        working-directory: apps/sai_tui
        run: dart test
      - name: Compile sai_tui
        # The terminal client ships as one binary (#41); prove it builds
        # and starts. The settings path keeps the run off any real file.
        run: |
          mkdir -p build
          dart compile exe apps/sai_tui/bin/sai_tui.dart -o build/sai_tui
          SAI_SETTINGS_FILE="$RUNNER_TEMP/settings.json" build/sai_tui reasoning

  macos:
    name: Test and build (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      - name: Test sai_core against the Keychain (macOS only)
        working-directory: packages/sai_core
        run: dart test test/secrets
      - name: Test sai_app
        working-directory: apps/sai_app
        run: flutter test
      - name: Build sai.app (debug)
        working-directory: apps/sai_app
        run: flutter build macos --debug
